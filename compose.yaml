services:
  gather:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      PHOTO_ROOT: /photos
      DATA_ROOT: /data
      PORT: 3000
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ${GATHER_PHOTOS:-./var/photos}:/photos
      - ${GATHER_DATA:-./var/data}:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
